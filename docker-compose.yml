version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: bmv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bmv_admin
      POSTGRES_PASSWORD: bmv_secure_pass_2026
      POSTGRES_DB: mitarbeiter_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmv_admin -d mitarbeiter_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bmv-backend
    restart: unless-stopped
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=bmv_admin
      - POSTGRES_PASSWORD=bmv_secure_pass_2026
      - POSTGRES_DB=mitarbeiter_portal
      - POSTGRES_PORT=5432
      - AD_MOCK_ENABLED=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bmv-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
